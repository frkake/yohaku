# CI-managed -- do not edit manually
appSlug: "stillmotion"
repo: "frkake/yohaku"
releases:
  - version: "1.1"
    tag: "stillmotion-server-v1.1"
    platforms:
      - os: "macOS"
        files:
          - arch: "Apple Silicon"
            filename: "StillMotion-Server-1.1.dmg"
            size: "5.9MB"
            noteKey: "note_dmg_installer"
            recommended: true
          - arch: "Apple Silicon"
            filename: "stillmotion-server-darwin-arm64"
            size: "6.7MB"
            noteKey: "note_cli_binary"
          - arch: "Intel"
            filename: "stillmotion-server-darwin-amd64"
            size: "7.1MB"
            noteKey: "note_cli_binary"
      - os: "Linux"
        files:
          - arch: "x86_64"
            filename: "stillmotion-server-linux-amd64"
            size: "6.9MB"
            noteKey: "note_cli_binary"
          - arch: "ARM64"
            filename: "stillmotion-server-linux-arm64"
            size: "6.6MB"
            noteKey: "note_raspberry_pi"
      - os: "Windows"
        files:
          - arch: "x86_64"
            filename: "stillmotion-server-windows-amd64.exe"
            size: "7.1MB"
            noteKey: "note_doubleclick"
          - arch: "ARM64"
            filename: "stillmotion-server-windows-arm64.exe"
            size: "6.6MB"
            noteKey: "note_doubleclick"
