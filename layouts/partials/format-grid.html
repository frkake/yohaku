{{/* Format Grid
     Expects: .formats (array of category, items) */}}
{{ $formats := .formats }}

<section class="format-grid-section fade-in-up">
  <h2>{{ i18n "supported_formats_title" | default "Supported Formats" }}</h2>
  <div class="format-table">
    {{ range $formats }}
      <div class="format-table-row">
        <span class="format-table-category">{{ .category }}</span>
        <span class="format-table-items">{{ delimit .items ", " }}</span>
      </div>
    {{ end }}
  </div>
</section>
