{{/* Custom 2-column footer: Apps | Connect */}}
<div class="footer-custom">
  {{/* Apps Column */}}
  <div>
    <h4 class="text-neutral-500 dark:text-neutral-400">Apps</h4>
    <ul>
      {{ range sort (index .Site.Data.apps) "slug" }}
        <li>
          <a href="{{ printf "/%s/apps/%s/" $.Site.Language.Lang .slug }}">{{ .name }}</a>
        </li>
      {{ end }}
    </ul>
  </div>

  {{/* Connect Column */}}
  <div>
    <h4 class="text-neutral-500 dark:text-neutral-400">Connect</h4>
    <ul>
      <li>
        <a href="{{ printf "/%s/contact/" .Site.Language.Lang }}">{{ i18n "contact" | default "Contact" }}</a>
      </li>
    </ul>
  </div>
</div>
