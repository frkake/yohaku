name: Release StillMotion Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout yohaku
        uses: actions/checkout@v4

      - name: Checkout StillMotion
        uses: actions/checkout@v4
        with:
          repository: frkake/StillMotion
          token: ${{ secrets.STILLMOTION_PAT }}
          path: StillMotion

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build LocalServer
        working-directory: StillMotion/LocalServer
        run: make all

      - name: Compute build hash
        id: build
        run: |
          cd StillMotion/LocalServer/build
          HASH=$(find . -maxdepth 1 -type f | sort | xargs shasum -a 256 | shasum -a 256 | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Build hash: $HASH"

          VERSION=$(grep 'VERSION ?=' ../Makefile | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Get latest release hash
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HASH=$(gh release list --json tagName,body --limit 100 \
            | jq -r '[.[] | select(.tagName | startswith("stillmotion-server/"))][0].body // ""' \
            | grep -oE 'build-hash:[a-f0-9]+' | cut -d: -f2 || echo "")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Latest release hash: ${HASH:-none}"

      - name: Create release
        if: steps.build.outputs.hash != steps.latest.outputs.hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.build.outputs.version }}"
          HASH="${{ steps.build.outputs.hash }}"
          TAG="stillmotion-server/v${VERSION}-$(date +%Y%m%d%H%M%S)"

          cd StillMotion/LocalServer/build

          # Zip the .app bundle for upload
          zip -r "StillMotion-Server.app.zip" "StillMotion Server.app"

          gh release create "$TAG" \
            --title "StillMotion Server v${VERSION}" \
            --notes "build-hash:${HASH}" \
            stillmotion-server-darwin-amd64 \
            stillmotion-server-darwin-arm64 \
            stillmotion-server-linux-amd64 \
            stillmotion-server-linux-arm64 \
            stillmotion-server-windows-amd64.exe \
            stillmotion-server-windows-arm64.exe \
            "StillMotion-Server-${VERSION}.dmg" \
            "StillMotion-Server.app.zip"

          echo "::notice::Released $TAG"

      - name: Skip release
        if: steps.build.outputs.hash == steps.latest.outputs.hash
        run: echo "::notice::Build hash unchanged. No release needed."
