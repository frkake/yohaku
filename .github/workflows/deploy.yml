name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.142.0"
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: /tmp/hugo_cache
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-hugomod-

      - name: Sync StillMotion Server release data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --json tagName \
            --jq '[.[] | select(.tagName | startswith("stillmotion-server-v"))][0].tagName // empty')

          if [ -z "$TAG" ]; then
            echo "No StillMotion Server release found, skipping sync"
            exit 0
          fi

          VERSION="${TAG#stillmotion-server-v}"
          echo "Syncing release: $TAG (version: $VERSION)"

          SIZES_JSON=$(gh release view "$TAG" --json assets --jq '.assets' | python3 -c "
          import json, sys
          assets = json.load(sys.stdin)
          sizes = {}
          for a in assets:
              name = a['name']
              if name == 'checksums.sha256':
                  continue
              size = a['size']
              if size >= 1024 * 1024:
                  sizes[name] = f'{size / 1024 / 1024:.1f}MB'
              else:
                  sizes[name] = f'{size / 1024:.0f}KB'
          print(json.dumps(sizes))
          ")

          python3 scripts/update-download-page.py \
            --version "$VERSION" \
            --sizes "$SIZES_JSON" \
            --repo "${{ github.repository }}" \
            --tag "$TAG"

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: /tmp/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tokyo
        run: |
          hugo \
            --gc \
            --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
